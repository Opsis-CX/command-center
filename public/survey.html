<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>How did we do?</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #F5F3EE; color: #1C2421; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { background: #fff; border: 1px solid #E8E4DC; border-radius: 18px; padding: 28px 22px; width: min(420px, 92vw); text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  h1 { font-size: 21px; margin: 0 0 6px; }
  p { color: #5F6763; font-size: 15px; line-height: 1.45; margin: 6px 0 16px; }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 10px 0 18px; }
  .stars button { width: 52px; height: 52px; border-radius: 12px; border: 1px solid #E8E4DC; background: #fff; font-size: 22px; font-weight: 800; color: #2F7D5B; cursor: pointer; }
  .stars button.on { background: #2F7D5B; color: #fff; border-color: #2F7D5B; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: #8A918D; margin: -10px 4px 16px; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid #E8E4DC; border-radius: 12px; padding: 10px; font: inherit; font-size: 15px; min-height: 80px; }
  .send { margin-top: 14px; width: 100%; padding: 13px; border: none; border-radius: 12px; background: #14302A; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .send:disabled { opacity: 0.5; cursor: default; }
  .err { color: #A8441A; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<main class="card" id="app"><p>Loading…</p></main>
<script>
(function () {
  // Post-call survey (2026-11-15). The token in ?t= is the only key; no login. Data: cx_survey_get / cx_survey_submit.
  var BASE = 'https://dqvuviyqrcrgapmxkoyx.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_I7ZGgWc9yC2v6gLsUNBdCA_lF56Atgs';
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var score = 0;
  function rpc(fn, body) {
    return fetch(BASE + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.message) || 'Something went wrong.'); return j; }); });
  }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function thanks() { app.innerHTML = '<h1>Thank you!</h1><p>Your feedback goes straight to the team.</p>'; }
  function show(info) {
    if (!info) { app.innerHTML = '<h1>This link has expired</h1><p>Thanks for thinking of us.</p>'; return; }
    if (info.answered) { thanks(); return; }
    app.innerHTML = '<h1>How did we do?</h1><p>Rate your call with ' + esc(info.brand || 'us') + (info.agent ? ' (you spoke with ' + esc(info.agent) + ')' : '') + '.</p>' +
      '<div class="stars">' + [1, 2, 3, 4, 5].map(function (n) { return '<button data-n="' + n + '" aria-label="' + n + ' out of 5">' + n + '</button>'; }).join('') + '</div>' +
      '<div class="scale"><span>Not good</span><span>Excellent</span></div>' +
      '<textarea id="c" placeholder="Anything you\'d like to tell us? (optional)" maxlength="1000"></textarea>' +
      '<button class="send" id="s" disabled>Send</button><div class="err" id="e"></div>';
    app.querySelectorAll('.stars button').forEach(function (b) {
      b.onclick = function () { score = +b.getAttribute('data-n'); app.querySelectorAll('.stars button').forEach(function (x) { x.classList.toggle('on', +x.getAttribute('data-n') <= score); }); document.getElementById('s').disabled = false; };
    });
    document.getElementById('s').onclick = function () {
      this.disabled = true;
      rpc('cx_survey_submit', { p_token: token, p_score: score, p_comment: document.getElementById('c').value || null })
        .then(function (r) { if (r && r.ok) thanks(); else { document.getElementById('e').textContent = (r && r.reason) || 'Something went wrong.'; } })
        .catch(function (e) { document.getElementById('e').textContent = e.message; document.getElementById('s').disabled = false; });
    };
  }
  if (!/^[0-9a-f]{24}$/.test(token)) { show(null); return; }
  rpc('cx_survey_get', { p_token: token }).then(show).catch(function () { show(null); });
})();
</script>
</body>
</html>
