<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GarageCo Call Quality — Opsis QA preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--line:#E8E4DC;--line2:#F1EEE8;--ink:#1C2421;--mut:#5F6763;--g:#2F7D5B;--gd:#1F5A41;--gl:#E6F0EA;--o:#E0662A;--od:#A8441A;--ol:#FCEBDD;--side:#14302A;--blue:#3A4380}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,sans-serif;font-size:14px}
a{color:var(--g)}
button{font-family:inherit;font-size:inherit}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:1 1 236px;max-width:100%;background:var(--side);color:#fff;padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px}
main{flex:999 1 640px;min-width:0;padding:16px 24px 32px;display:flex;flex-direction:column;gap:16px}
.logo{background:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:center;min-height:64px}
.logo img{max-width:100%;max-height:48px;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:10px;color:#D6E2DC;font-size:14px;cursor:pointer;min-height:44px}
.nav button:hover{background:#1F3F37;color:#fff}
.nav button.on{background:#2A4A42;color:#fff;font-weight:600}
.nav button:focus-visible,.click:focus-visible,button:focus-visible{outline:2px solid #7CC4A4;outline-offset:2px}
.navsec{font-size:10px;letter-spacing:.18em;color:#9DBBAE;padding:14px 14px 4px;font-weight:600}
.powered{margin-top:auto;border-top:1px solid #234840;padding:14px 8px 0;font-size:11.5px;color:#BFD1C8;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.ttl{margin:0;font-size:17px;font-weight:600;letter-spacing:-0.02em}
.sub{margin:4px 0 0;font-size:12.5px;color:var(--mut);line-height:1.45}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#56605B}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.more{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:#2F5E4E;min-height:32px;display:inline-flex;align-items:center;gap:4px}
.more:hover{color:var(--ink)}
.sel{border:1px solid #E1DCD2;background:#fff;font-size:13px;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.sel:hover{border-color:#B9B2A6}
.btnd{background:var(--side);border-color:var(--side);color:#fff}
.btnd:hover{border-color:var(--side)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56605B;padding:0 8px 10px;white-space:nowrap;cursor:default}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:10px 8px;white-space:nowrap;border-top:1px solid var(--line2)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FAF8F3}
.track{height:6px;border-radius:999px;background:#EEEBE4;overflow:hidden}
.track>div{height:100%;border-radius:999px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grid{display:grid;gap:12px}
.banner{background:#FFF8E8;border:1px solid #F0DDB0;color:#6B4E12;border-radius:12px;padding:9px 14px;font-size:12.5px}
input,textarea,select{font-family:inherit;font-size:13.5px;color:var(--ink)}
.field{border:1px solid #E1DCD2;border-radius:10px;padding:10px 12px;width:100%;background:#fff}
label.l{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#3B4541}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:80;display:none}
.overlay{position:fixed;inset:0;background:rgba(20,48,42,.35);display:flex;justify-content:flex-end;z-index:60}
.drawer{width:640px;max-width:100%;height:100%;overflow-y:auto;background:#F7F5F0;padding:22px;display:flex;flex-direction:column;gap:14px}
.click{cursor:pointer}
.chip{border:1px solid #E1DCD2;background:#fff;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:34px;color:var(--ink);text-align:left}
.chip:hover{border-color:var(--g);color:var(--gd)}
.chip.on{background:var(--side);color:#fff;border-color:var(--side)}
.seg{display:inline-flex;background:#fff;border:1px solid #E1DCD2;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink);min-height:34px}
.seg button.on{background:var(--side);color:#fff}
.skel{background:linear-gradient(90deg,#EEEBE4 25%,#F6F4EF 50%,#EEEBE4 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ai{background:linear-gradient(0deg,#fff,#fff);border:1px solid #CFE3D8;border-radius:14px;padding:18px}
.ai .md{line-height:1.6;font-size:13.5px}
.ai .md ul{margin:8px 0;padding-left:20px}
.ai .md li{margin:3px 0}
.lnk{color:var(--gd);font-weight:600;cursor:pointer;border-bottom:1px dashed #9CC6B2}
.lnk:hover{color:var(--ink)}
.dots span{display:inline-block;width:7px;height:7px;border-radius:999px;background:var(--g);margin-right:4px;animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.12);padding:12px;min-width:260px;max-height:420px;overflow:auto}
.crumb{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{all:unset;cursor:pointer;color:var(--gd);font-weight:600}
.step{padding:12px;border-top:1px solid var(--line2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{text-align:center;font-size:12px;color:var(--mut);padding:8px 0 0}
@media (max-width:760px){main{padding:12px 14px 28px}.hero h1{font-size:26px!important}.drawer{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img src="https://dqvuviyqrcrgapmxkoyx.supabase.co/storage/v1/object/public/portal-assets/garageco/logo.png" alt="GarageCo"></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="powered"><svg width="22" height="18" viewBox="0 0 34 30" fill="none" stroke="#BFD1C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 15h7l3-9 4 18 4-14 3 5h11"/></svg><span>Powered by <b style="color:#fff;font-weight:600">Opsis CX</b></span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var API = 'https://dqvuviyqrcrgapmxkoyx.supabase.co/functions/v1/opsis-qa-preview';
  var KEY = 'rfXuf5Y0GKiFVWd49SuutEg';
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pct = function (a, b) { return b ? a / b * 100 : null; };
  var p1 = function (v) { return v == null ? '—' : v.toFixed(1) + '%'; };
  var G = '#2F7D5B', O = '#E0662A';
  var SHORT = { 'Cedar Park Overhead Door': 'Cedar Park', 'Apple Door': 'Apple', 'Omaha Door': 'Omaha', 'Cheney Door': 'Cheney', 'Quality Overhead Door': 'Quality', 'Cunningham Door': 'Cunningham', 'Genson Overhead Door': 'Genson' };
  var short = function (b) { return SHORT[b] || b || '—'; };
  var BCOL = ['#1F5A41', '#8A5A2B', '#B4452A', '#3B4541', '#7A2E1C', '#8C7A1E', '#6B2E2E', '#2F5E4E', '#2E4A6B', '#4A5A3B', '#5B3A6B', '#2B5B6B'];
  var bcol = function (b) { var h = 0; for (var i = 0; i < (b || '').length; i++) h = (h * 31 + b.charCodeAt(i)) >>> 0; return BCOL[h % BCOL.length]; };
  var STEPNAMES = { greeting: 'Greeting', empathy: 'Acknowledge / empathy', verify_approver: 'Verify + confirm approver', discovery: 'Discovery', set_expectations: 'Set expectations', explain_fee: 'Explain the fee', offer_appt: 'Offer next appointment', ask_booking: 'Ask for the booking', capture_payment: 'Capture payment', confirm_details: 'Confirm appointment details', thank_close: 'Thank customer + close' };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var fdate = function (d) { if (!d) return ''; var p = d.split('-'); return MONTHS[+p[1] - 1] + ' ' + (+p[2]); };
  var fhour = function (h) { return h == null ? '' : (h === 0 ? '12a' : h < 12 ? h + 'a' : h === 12 ? '12p' : (h - 12) + 'p'); };
  var fsecs = function (s) { return s ? Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) : '—'; };

  function todayET() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); }
  function addDays(d, n) { var x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5) + 1; }

  // ---------------- state ----------------
  var S = {
    view: 'overview', brand: null, agent: null,           // drill targets
    range: '30', start: null, end: null, brands: [],       // filters
    calls: { outcome: null, step: null, scoreMax: null, scoreMin: null, winnable: null, q: '', offset: 0, sort: 'new' },
    callId: null, adj: {}, change: null, pop: null, ask: { open: false, msgs: [], busy: false },
    csrSort: 'calls', brandSort: 'calls'

  function applyRange() {
    var t = todayET();
    if (S.range === 'custom' && S.start && S.end) return;
    if (S.range === 'month') { S.end = t; S.start = t.slice(0, 8) + '01'; return; }
    if (S.range === 'lastmonth') { var f = t.slice(0, 8) + '01'; S.end = addDays(f, -1); S.start = S.end.slice(0, 8) + '01'; return; }

  }
  applyRange();
  function prevWin() { var n = daysBetween(S.start, S.end); return { start: addDays(S.start, -n), end: addDays(S.start, -1) }; }

  // ---------------- data ----------------
  var cache = {};
  function api(body) {
    var k = JSON.stringify(body);
    if (body.action !== 'ask' && cache[k]) return cache[k];
    var pr = fetch(API, { method: 'POST', headers: { 'content-type': 'application/json', 'x-preview-key': KEY }, body: k })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
    if (body.action !== 'ask') { cache[k] = pr; pr.catch(function () { delete cache[k]; }); }
    return pr;
  }
  function win(extra) { var o = { start: S.start, end: S.end, brands: S.brands.length ? S.brands : null }; for (var k in extra) o[k] = extra[k]; return o; }
  function loadReport() { return api(Object.assign({ action: 'report' }, win())); }
  function loadPrevReport() { var p = prevWin(); return api({ action: 'report', start: p.start, end: p.end, brands: S.brands.length ? S.brands : null }); }
  function loadFocus(brand, agent) { return api({ action: 'focus', start: S.start, end: S.end, brand: brand || null, agent: agent || null }); }

  var KNOWN = { brands: [], agents: [] };

  // ---------------- tiny helpers ----------------
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 2600); }
  function series(vals, w, h, pad) {

  }
  function delta(cur, prev, unit, goodUp) {

  }
  function avatar(name, size) {

    return '<span aria-hidden="true" style="width:' + size + 'px;height:' + size + 'px;border-radius:999px;background:' + hues[(name || 'x').charCodeAt(0) % hues.length] + ';font-size:' + Math.round(size * .34) + 'px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">' + esc(ini) + '</span>';
  }
  function bbadge(b) { return '<span aria-hidden="true" style="width:26px;height:26px;border-radius:999px;background:' + bcol(b) + ';color:#fff;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">' + esc(short(b) === 'Cedar Park' ? 'CP' : short(b).charAt(0)) + '</span>'; }
  function chipScore(s) { return s >= 85 ? 'background:#E6F0EA;color:#1F5A41' : (s >= 70 ? 'background:#F3F1EC;color:#3B4541' : 'background:#FCEBDD;color:#A8441A'); }
  function chipOut(o) { return o === 'Booked' ? 'background:#E6F0EA;color:#1F5A41' : (o === 'Not Booked' ? 'background:#FCEBDD;color:#A8441A' : (o === 'Transferred' ? 'background:#E8EAF4;color:#3A4380' : 'background:#F3F1EC;color:#3B4541')); }
  function skel(h, n) { var s = ''; for (var i = 0; i < (n || 1); i++) s += '<div class="skel" style="height:' + h + 'px;margin:8px 0"></div>'; return s; }
  function errBox(e) { return '<div class="card" style="color:#A8441A">Couldn’t load this: ' + esc(e.message || e) + ' <button class="more" data-act="retry">Try again</button></div>'; }
  function iconPath(k) {
    return {

  function renderNav() {

  function topbar() {

      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F7D5B" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>' +
      '<label for="askq" class="sr">Ask anything about your calls</label><input id="askq" autocomplete="off" placeholder="Ask anything — “Who is the top performer at Cedar Park?”" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:14px">' +

      popHtml() + '</div>' +
      '<div class="banner"><b>Preview</b> · Live GarageCo results. Phone numbers and customer details are hidden. Changes you make here aren’t saved.</div>';
  }
  function popHtml() {
    if (S.pop === 'range') {
      return '<div class="pop" style="right:0;top:52px"><div class="cap" style="margin-bottom:8px">Date range</div><div style="display:flex;flex-direction:column;gap:4px">' +
        RANGES.filter(function (r) { return r[0] !== 'custom'; }).map(function (r) { return '<button class="chip' + (S.range === r[0] ? ' on' : '') + '" data-range="' + r[0] + '">' + r[1] + '</button>'; }).join('') +
        '</div><div class="cap" style="margin:12px 0 6px">Custom</div><div style="display:flex;gap:6px;align-items:center"><label class="sr" for="cs">Start</label><input id="cs" type="date" class="field" value="' + S.start + '"><span class="mut">–</span><label class="sr" for="ce">End</label><input id="ce" type="date" class="field" value="' + S.end + '"></div><button class="sel btnd" data-act="customrange" style="margin-top:8px;width:100%;justify-content:center">Apply</button></div>';
    }
    if (S.pop === 'brands') {

    var A = S.ask, h = '<div class="overlay" data-close="1"><div class="drawer" role="dialog" aria-modal="true" aria-label="Ask your call data" style="background:#fff"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div style="display:flex;gap:10px;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F7D5B" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg><div><b style="font-size:16px">Ask your call data</b><div class="mut" style="font-size:12px">' + (S.brands.length ? S.brands.map(short).join(', ') : 'All brands') + ' · ' + fdate(S.start) + ' – ' + fdate(S.end) + '</div></div></div><button class="sel" data-close="1" aria-label="Close" style="width:44px;justify-content:center">✕</button></div><div id="convo" style="display:flex;flex-direction:column;gap:12px;flex:1">';
    if (!A.msgs.length) h += '<p class="mut" style="font-size:13px">Ask anything about your calls, brands and CSRs. Answers are built from your live call data.</p><div style="display:flex;flex-direction:column;gap:6px">' + SUGGEST.map(function (q) { return '<button class="chip" data-ask="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div>';
    A.msgs.forEach(function (m) {
      if (m.role === 'user') h += '<div style="align-self:flex-end;background:var(--side);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:85%;font-size:13.5px">' + esc(m.content) + '</div>';
      else h += '<div class="ai" style="max-width:100%"><div class="md">' + (m.error ? '<span style="color:#A8441A">' + esc(m.content) + '</span>' : md(m.content)) + '</div></div>';
    });
    if (A.busy) h += '<div class="ai"><span class="dots"><span></span><span></span><span></span></span> <span class="mut" style="font-size:13px">Looking through your calls…</span></div>';
    h += '</div><form id="askform2" style="display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:8px"><label class="sr" for="askq2">Follow-up question</label><input id="askq2" class="field" placeholder="Ask a follow-up…" autocomplete="off"' + (A.busy ? ' disabled' : '') + '><button class="sel btnd" type="submit"' + (A.busy ? ' disabled' : '') + '>Ask</button></form></div></div>';
    $('layer').innerHTML = h;
    var cv = $('convo'); if (cv) cv.parentNode.scrollTop = cv.parentNode.scrollHeight;
    var i2 = $('askq2'); if (i2 && !A.busy) i2.focus();
  }
  function ask(q) {
    q = (q || '').trim(); if (!q) return;
    var A = S.ask; A.open = true; S.callId = null;
    var history = A.msgs.filter(function (m) { return !m.error; }).slice(-6);
    A.msgs.push({ role: 'user', content: q }); A.busy = true; askPanel();
    api({ action: 'ask', question: q, history: history, start: S.start, end: S.end, brands: S.brands.length ? S.brands : null }).then(function (r) {
      A.msgs.push({ role: 'assistant', content: r.answer }); A.busy = false; if (A.open) askPanel();
    }).catch(function (e) { A.msgs.push({ role: 'assistant', content: e.message, error: true }); A.busy = false; if (A.open) askPanel(); });
  }

  // ---------- routing ----------
  var T = 0;
  function writeHash() {
    var o = { v: S.view, r: S.range };
    if (S.range === 'custom') { o.s = S.start; o.e = S.end; }
    if (S.brands.length) o.b = S.brands.join('|');
    if (S.view === 'brand') o.brand = S.brand; if (S.view === 'csr') o.agent = S.agent;
    var h = '#' + Object.keys(o).map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&');
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  function readHash() {
    var q = {}; location.hash.replace(/^#/, '').split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || ''); });
    if (q.v) S.view = q.v; if (q.r) S.range = q.r; if (q.s && q.e) { S.start = q.s; S.end = q.e; }
    if (q.b) S.brands = q.b.split('|'); if (q.brand) S.brand = q.brand; if (q.agent) S.agent = q.agent;
    applyRange();
  }
  function render() {
    T++; var tok = T; renderNav(); writeHash();
    var v = { overview: vOverview, brands: vBrands, brand: function (t) { vFocus(t, 'brand'); }, csr: function (t) { vFocus(t, 'csr'); }, csrs: vCsrs, calls: vCalls, insights: vInsights, kb: vKb, settings: vSettings, team: vTeam }[S.view] || vOverview;
    v(tok);
    var af = $('askform'); if (af) af.addEventListener('submit', function (e) { e.preventDefault(); var q = $('askq').value; $('askq').value = ''; ask(q); });
    var cf = $('callq'); if (cf) cf.addEventListener('submit', function (e) { e.preventDefault(); var c = S.calls; c.q = $('cq').value.trim(); c.outcome = $('co').value || null; c.step = $('cs2').value || null; var sc = $('csc').value; c.scoreMax = sc === 'max40' ? 40 : sc === 'max70' ? 70 : null; c.scoreMin = sc === 'min90' ? 90 : null; c.offset = 0; render(); });
    var cq = $('csrq'); if (cq) cq.addEventListener('input', function () { S.csrQ = cq.value; S.csrFocus = true; clearTimeout(cq.t); cq.t = setTimeout(render, 250); });
    var cm = $('csrmin'); if (cm) cm.addEventListener('change', function () { S.csrMin = +cm.value; render(); });
  }
  function go(view) { S.view = view; S.pop = null; window.scrollTo(0, 0); render(); }
  function openCalls(filters, agent) { S.calls = Object.assign({ outcome: null, step: null, scoreMax: null, scoreMin: null, winnable: null, q: '', offset: 0, nocard: false }, filters || {}); S.callsAgent = agent || null; if (S.ask.open) closeLayer(); go('calls'); }
  function closeLayer() { S.callId = null; S.ask.open = false; $('layer').innerHTML = ''; }

  document.addEventListener('submit', function (e) {
    if (e.target.id === 'askform2') { e.preventDefault(); var q = $('askq2').value; ask(q); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target;
    var chg = document.getElementById('chg');
    if (chg) {
      var b = t.closest('[data-pick],[data-closechg],[data-act="applychange"]');
      if (t.closest('[data-pick]')) { S.pick = t.closest('[data-pick]').dataset.pick; chg.querySelectorAll('[data-pick]').forEach(function (x) { x.classList.toggle('on', x.dataset.pick === S.pick); }); return; }
      if (t.closest('[data-act="applychange"]')) {
        var why = $("chgwhy").value.trim(); if (!why) { toast('Add a short reason so the change can be reviewed.'); return; }
        var s = S.cur.steps[S.change], key = S.callId + '|' + s.key;
        if (S.pick === s.answer) delete S.adj[key]; else S.adj[key] = { r: S.pick, why: why };
        chg.remove(); drawCall(); toast('Score updated · original kept · Opsis CX Support team notified'); return;
      }
      if (t === chg || t.closest('[data-closechg]')) { chg.remove(); return; }
      return;
    }
    var el = t.closest('[data-go],[data-brand],[data-agent],[data-call],[data-close],[data-kpi],[data-step],[data-ask],[data-pop],[data-range],[data-act],[data-bsort],[data-csort],[data-mix],[data-page],[data-unfilter],[data-callsfor],[data-change],[data-q],[data-outcome],[data-brandcb],[data-allbrands]');
    if (S.pop && !t.closest('.pop') && !t.closest('[data-pop]')) { S.pop = null; render(); if (!el) return; }
    if (!el) return;
    var d = el.dataset;
    if (d.brandcb !== undefined || d.allbrands !== undefined) {
      if (d.allbrands !== undefined) S.brands = [];
      else { var i = S.brands.indexOf(d.brandcb); if (i >= 0) S.brands.splice(i, 1); else S.brands.push(d.brandcb); }
      render(); return;
    }
    if (d.close && t !== el && !t.closest('button[data-close]') && t.closest('.drawer')) { /* inside drawer */ }
    else if (d.close) { e.preventDefault(); closeLayer(); return; }
    e.preventDefault();
    if (d.go) { if (S.ask.open || S.callId) closeLayer(); go(d.go); }
    else if (d.brand !== undefined && !d.outcome) { closeLayer(); S.brand = d.brand; go('brand'); }
    else if (d.agent !== undefined) { closeLayer(); S.agent = d.agent; go('csr'); }
    else if (d.call) { S.ask.open = false; S.callId = d.call; callDrawer(); }
    else if (d.change !== undefined) { S.change = +d.change; changeModal(); }
    else if (d.kpi) {
      var map = { lowscore: { scoreMax: 40 }, notbooked: { outcome: 'Not Booked' }, noask: { step: 'ask_booking' }, nocard: { nocard: true }, winnable: { winnable: true, scoreMax: 40 } };
      openCalls(map[d.kpi]);
    }
    else if (d.step) { openCalls({ step: d.step }, d.sagent || null); if (d.sbrand) { S.brands = [d.sbrand]; render(); } }
    else if (d.callsfor) { if (d.callsfor === 'csr') openCalls({}, S.agent); else { S.brands = [S.brand]; openCalls({}); } }
    else if (d.ask) { ask(d.ask); }
    else if (d.q !== undefined || d.outcome) { openCalls({ q: d.q || '', outcome: d.outcome || null }); }
    else if (d.pop) { S.pop = S.pop === d.pop ? null : d.pop; render(); }
    else if (d.range) { S.range = d.range; S.pop = null; cache = {}; applyRange(); render(); }
    else if (d.bsort) { S.brandSort = d.bsort; render(); }
    else if (d.csort) { S.csrSort = d.csort; render(); }
    else if (d.mix) { S.mix = d.mix; if (lastFocus) focusMix(lastFocus, $('fmix').dataset.fb, $('fmix').dataset.fa); }
    else if (d.page) { S.calls.offset = Math.max(0, S.calls.offset + (+d.page) * 25); window.scrollTo(0, 0); render(); }
    else if (d.unfilter) { var c = S.calls; if (d.unfilter === 'all') { S.calls = { offset: 0 }; S.callsAgent = null; } else if (d.unfilter === 'agent') S.callsAgent = null; else { c[d.unfilter] = d.unfilter === 'q' ? '' : null; c.offset = 0; } render(); }
    else if (d.act) {
      var a = d.act;
      if (a === 'customrange') { var cs = $('cs').value, ce = $('ce').value; if (cs && ce && cs <= ce) { S.range = 'custom'; S.start = cs; S.end = ce; S.pop = null; render(); } else toast('Pick a start date before the end date.'); }
      else if (a === 'closepop') { S.pop = null; render(); }
      else if (a === 'retry') { cache = {}; render(); }
      else if (a === 'undo') { Object.keys(S.adj).forEach(function (k) { if (k.indexOf(S.callId + '|') === 0) delete S.adj[k]; }); drawCall(); toast('Restored the AI score'); }
      else if (a === 'kbadd') { var tt = $('kbt').value.trim(); if (!tt) { toast('Add a title first'); return; } KB.unshift({ t: tt, cat: $('kbc').value, who: 'GarageCo admin', when: 'Today', body: $('kbb').value.trim() || '—' }); vKb(); toast('Added — the AI uses it on new calls'); }
      else toast({ send: 'Sent to the CSR’s coaching inbox (preview)', pdf: 'PDF ready (preview)', save: 'Saved (preview — not stored)', request: 'Request sent to the Opsis CX Support team (preview)', invite: 'Invite sent (preview)' }[a] || 'Done (preview)');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var chg = $('chg'); if (chg) { chg.remove(); return; } if (S.pop) { S.pop = null; render(); return; } if ($('layer').innerHTML) closeLayer(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.click,.lnk')) { e.preventDefault(); e.target.click(); }
    if (e.key === '/' && !e.target.matches('input,textarea,select')) { e.preventDefault(); var q = $('askq'); if (q) q.focus(); }
  });
  window.addEventListener('hashchange', function () { var before = location.hash; readHash(); render(); });
  readHash(); render();
})();
</script>
