<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opsis QA — Preview for GarageCo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--line:#E8E4DC;--line2:#F1EEE8;--ink:#1C2421;--mut:#6B726E;--g:#2F7D5B;--gd:#1F5A41;--gl:#E6F0EA;--o:#E0662A;--od:#A8441A;--ol:#FCEBDD;--side:#14302A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,sans-serif;font-size:14px}
a{color:var(--g)}
button{font-family:inherit}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:1 1 230px;max-width:100%;background:var(--side);color:#fff;padding:28px 16px 20px;display:flex;flex-direction:column;gap:26px}
main{flex:999 1 640px;min-width:0;padding:16px 24px 48px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:13px;width:100%;padding:11px 14px;border-radius:10px;color:#D6E2DC;font-size:14px;cursor:pointer;min-height:44px}
.nav button:hover{background:#1F3F37;color:#fff}
.nav button.on{background:#2A4A42;color:#fff;font-weight:600}
.navsec{font-size:10px;letter-spacing:.18em;color:#8FAFA2;padding:14px 14px 4px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.ttl{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.02em}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5E6662}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.more{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;color:#2F5E4E;min-height:32px;display:inline-flex;align-items:center}
.more:hover{color:var(--ink)}
.sel{border:1px solid #E1DCD2;background:#fff;font-size:13px;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.sel:hover{border-color:#B9B2A6;color:var(--ink)}
.btnd{background:var(--side);border-color:var(--side);color:#fff}
.btnd:hover{color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5E6662;padding:0 8px 10px;white-space:nowrap}
.tbl td{padding:10px 8px;white-space:nowrap;border-top:1px solid var(--line2)}
.track{height:5px;border-radius:999px;background:#EEEBE4;overflow:hidden}
.track>div{height:100%;border-radius:999px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grid{display:grid;gap:12px}
.banner{background:#FFF8E8;border:1px solid #F0DDB0;color:#6B4E12;border-radius:12px;padding:10px 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,textarea,select{font-family:inherit;font-size:13.5px;color:var(--ink)}
.field{border:1px solid #E1DCD2;border-radius:10px;padding:10px 12px;width:100%;background:#fff}
label.l{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#3B4541}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:50;display:none}
.overlay{position:fixed;inset:0;background:rgba(20,48,42,.35);display:flex;justify-content:flex-end;z-index:40}
.drawer{width:520px;max-width:100%;height:100%;overflow-y:auto;background:#fff;padding:28px;display:flex;flex-direction:column;gap:18px}
.step{padding:14px 12px;border-top:1px solid var(--line2);border-radius:10px}
.step.hl{background:#F0F7F3}
.tline{display:flex;gap:10px;padding:8px 10px;border-radius:10px}
.tline.hl{background:var(--gl);outline:2px solid var(--g)}
.tline.miss{background:#FFF6F3}
.seg{border:1px solid #E1DCD2;background:#fff;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;min-height:34px;color:var(--ink)}
.seg.on{background:var(--side);color:#fff;border-color:var(--side)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){main{padding:12px 16px 40px}aside{padding:18px 12px}.hero h1{font-size:28px!important}}
</style>
</head>

    else if (d.close) { state.call = null; state.change = null; }
    else if (d.review) { state.tab = 'review'; state.call = null; window.scrollTo(0, 0); }
    else if (d.filter) state.filter = d.filter;
    else if (d.jump) { var st = RSTEPS[+d.jump]; state.focus = st.t; }
    else if (d.change) { state.change = +d.change; pick = answerOf(RSTEPS[+d.change]); }
    else if (d.pick) { pick = d.pick; document.querySelectorAll('[data-pick]').forEach(function (b) { b.classList.toggle('on', b.dataset.pick === pick); }); return; }
    else if (d.act) {
      var a = d.act;
      if (a === 'applychange') {
        var why = ($('why') && $('why').value.trim()) || '';
        if (!why) { toast('Add a short reason so the change is reviewable.'); return; }
        var s = RSTEPS[state.change];
        if (pick === s.r) delete state.adj[s.k]; else state.adj[s.k] = { r: pick, why: why };
        state.change = null; toast('Score updated · original kept · Opsis CX Support team notified');
      } else if (a === 'undo') { state.adj = {}; toast('Restored the AI score'); }
      else if (a === 'kbadd') { var t = $('kbt').value.trim(); if (!t) { toast('Add a title first'); return; } KB.unshift({ t: t, cat: $('kbc').value, who: 'GarageCo admin', when: 'Today', body: $('kbb').value.trim() || '—' }); toast('Added — the AI uses it on new calls'); }
      else toast({ pdf: 'PDF ready (preview)', reason: 'Call reason updated (preview)', send: 'Sent to the CSR’s coaching inbox (preview)', tag: 'Tag added (preview)', task: 'Follow-up task created (preview)', note: 'Note saved (preview)', play: 'Audio plays here in the real app', save: 'Saved (preview — not stored)', request: 'Request sent to the Opsis CX Support team (preview)', invite: 'Invite sent (preview)' }[a] || 'Done (preview)');
    }
    render();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (state.call != null || state.change != null)) { state.call = null; state.change = null; render(); } });
  render();
})();
</script>
</body>
</html>
