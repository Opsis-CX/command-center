# Copies the STRUCTURE of the live database (tables, columns, rules, functions, triggers)
# into the STAGING database. Copies NO data — no employees, calls, customers or messages.
# Run it by hand: GitHub → Actions → "Sync staging database structure" → Run workflow.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   PROD_DB_URL     – live database connection string (Session pooler, port 5432, read-only staging_sync login)
#   STAGING_DB_URL  – staging database connection string (Session pooler, port 5432)
name: Sync staging database structure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STAGING to confirm (this replaces the staging database structure)'
        required: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the connection strings (never prints passwords)
        env:
          RAW_STAGING: ${{ secrets.STAGING_DB_URL }}
          RAW_PROD: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "STAGING" ]; then echo "❌ Type STAGING (all capitals) to confirm."; exit 1; fi

          # Forgive common paste slips: spaces, line breaks, quotes, a leading NAME= .
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^[A-Z_]*=//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
          STAGING="$(clean "$RAW_STAGING")"; PROD="$(clean "$RAW_PROD")"

          explain() {   # $1 = label, $2 = url
            u="$2"; ok=1
            case "$u" in postgresql://*|postgres://*) ;; *) echo "❌ $1 should start with postgresql://"; ok=0;; esac
            case "$u" in *'[YOUR-PASSWORD]'*|*'['*|*']'*) echo "❌ $1 still has [ ] brackets — replace [YOUR-PASSWORD] (brackets included) with the password."; ok=0;; esac
            case "$u" in *@*) ;; *) echo "❌ $1 has no @ — the password part is missing."; ok=0;; esac
            case "$u" in *:5432/*) ;; *) echo "❌ $1 should use port 5432 (Session pooler)."; ok=0;; esac
            user="$(printf '%s' "$u" | sed -E 's#^[a-z]+://([^:@]+).*#\1#')"
            host="$(printf '%s' "$u" | sed -E 's#^.*@([^:/]+).*#\1#')"
            echo "   $1 → user: $user · host: $host"
            [ $ok = 1 ]
          }
          echo "Checking connection strings (passwords are never shown):"
          explain STAGING_DB_URL "$STAGING" || exit 1
          explain PROD_DB_URL "$PROD" || exit 1

          # Staging must be the staging project and never the live one; prod must be live.
          case "$STAGING" in *suctozsxsqjnlyecqfer*) ;; *) echo "❌ STAGING_DB_URL is not the staging project — stopping."; exit 1;; esac
          case "$STAGING" in *dqvuviyqrcrgapmxkoyx*) echo "❌ STAGING_DB_URL points at LIVE — stopping."; exit 1;; esac
          case "$PROD" in *dqvuviyqrcrgapmxkoyx*) ;; *) echo "❌ PROD_DB_URL is not the live project — stopping."; exit 1;; esac

          echo "STAGING_URL=$STAGING" >> "$GITHUB_ENV"
          echo "PROD_URL=$PROD" >> "$GITHUB_ENV"
          echo "::add-mask::$STAGING"
          echo "::add-mask::$PROD"
          echo "✅ Connection strings look right."

      - name: Install the Postgres 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Test both connections
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          $PSQL "$PROD_URL" -tAc "select 'live connection ok — ' || count(*) || ' tables' from pg_tables where schemaname='public'" || { echo "❌ Couldn't sign in to LIVE with PROD_DB_URL. Check the user (staging_sync.dqvuviyqrcrgapmxkoyx) and password."; exit 1; }
          $PSQL "$STAGING_URL" -tAc "select 'staging connection ok — ' || count(*) || ' tables' from pg_tables where schemaname='public'" || { echo "❌ Couldn't sign in to STAGING with STAGING_DB_URL. Check the password you reset."; exit 1; }

      - name: Copy the live structure (no data)
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$PROD_URL" --schema-only --schema=public --no-owner -f live_structure.sql
          echo "Lines in structure file: $(wc -l < live_structure.sql)"

      - name: Replace the staging structure
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          $PSQL "$STAGING_URL" -v ON_ERROR_STOP=1 <<'SQL'
          drop schema if exists public cascade;
          create schema public;
          grant usage on schema public to postgres, anon, authenticated, service_role;
          grant all on schema public to postgres, service_role;
          alter default privileges in schema public grant all on tables to postgres, anon, authenticated, service_role;
          alter default privileges in schema public grant all on functions to postgres, anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to postgres, anon, authenticated, service_role;
          SQL
          $PSQL "$STAGING_URL" -v ON_ERROR_STOP=0 -q -f live_structure.sql 2>&1 | grep -iE "error" | head -n 40 || true
          echo "✅ Done. Tables in staging now: $($PSQL "$STAGING_URL" -tAc "select count(*) from pg_tables where schemaname='public'")"
